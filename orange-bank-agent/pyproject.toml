[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orange-bank-agent"
version = "0.1.0"
description = "Agent bancaire pédagogique (LangGraph + LiteLLM + Chroma + Langfuse)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-litellm>=0.2",
    "langgraph>=0.4",
    "litellm>=1.50",
    "langfuse>=3,<4",
    "chromadb>=0.5",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
orange-bank = "orange_bank_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
